spring:
  application:
    name: pediupatrao
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/pediupatrao?replicaSet=rs0&directConnection=true}
      auto-index-creation: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-ignored-properties: true
      accept-float-as-int: false
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
app:
  bootstrap:
    login: ${BOOTSTRAP_ADMIN_LOGIN:admin}
    senha: ${BOOTSTRAP_ADMIN_SENHA:}
